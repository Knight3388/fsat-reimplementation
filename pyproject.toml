[project]
name = "fsat"
version = "0.1.0"
description = "Reimplementation of F-SAT (Frequency-Selective Adversarial Training) from 'I Can Hear You: Selective Robust Training for Deepfake Audio Detection' (Zhang et al., arXiv:2411.00121v1)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]

[project.scripts]
fsat-train = "fsat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsat"]

[dependency-groups]
dev = ["pytest>=8.0"]
